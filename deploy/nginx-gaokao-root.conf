# 整机独占：用 IP/域名根路径访问
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/gaokao-volunteer;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
