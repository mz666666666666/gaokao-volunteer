# 挂载到已有 Nginx：路径 /gaokao-volunteer/
# 若站点独占整机，可改用 nginx-gaokao-root.conf
location /gaokao-volunteer/ {
    alias /var/www/gaokao-volunteer/;
    index index.html;
    try_files $uri $uri/ /gaokao-volunteer/index.html;
}

location /gaokao-volunteer/assets/ {
    alias /var/www/gaokao-volunteer/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
